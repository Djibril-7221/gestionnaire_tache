<!-- Barre mobile -->
<div class="md:hidden fixed top-0 left-0 right-0 h-14 bg-[#0C2A20] flex items-center justify-between px-4 z-40">
  <span class="text-[#F4F7F5] text-sm font-semibold tracking-wide">{{ espace() }}</span>
  <button (click)="bascule()" aria-label="Ouvrir le menu"
    class="w-9 h-9 flex flex-col items-center justify-center gap-[5px] group">
    <span class="block w-5 h-[2px] bg-[#F4F7F5] transition-transform"
      [class.rotate-45]="ouvert()" [class.translate-y-[7px]]="ouvert()"></span>
    <span class="block w-5 h-[2px] bg-[#F4F7F5] transition-opacity" [class.opacity-0]="ouvert()"></span>
    <span class="block w-5 h-[2px] bg-[#F4F7F5] transition-transform"
      [class.-rotate-45]="ouvert()" [class.-translate-y-[7px]]="ouvert()"></span>
  </button>
</div>

<!-- Fond assombri (mobile, quand ouvert) -->
@if (ouvert()) {
  <div class="md:hidden fixed inset-0 bg-black/50 z-40" (click)="fermer()"></div>
}

<!-- Sidebar -->
<aside
  class="fixed top-0 left-0 h-full w-64 bg-[#0C2A20] flex flex-col z-50 transition-transform duration-300 ease-out md:translate-x-0"
  [class.-translate-x-full]="!ouvert()">

  <div class="h-14 md:h-20 flex items-center px-6 border-b border-[#1D4534]">
    <div class="w-2 h-2 rounded-full bg-[#35D68C] mr-3 shrink-0"></div>
    <span class="text-[#F4F7F5] text-sm font-semibold tracking-wide uppercase">{{ espace() }}</span>
  </div>

  <nav class="flex-1 px-3 py-6 space-y-1">
    @for (link of links(); track link.route) {
      <a [routerLink]="link.route" routerLinkActive #rla="routerLinkActive"
        (click)="fermer()"
        class="relative flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors"
        [class.text-[#F4F7F5]]="rla.isActive"
        [class.bg-[#15402F]]="rla.isActive"
        [class.text-[#8FAFA0]]="!rla.isActive"
        [class.hover:bg-[#15402F]/60]="!rla.isActive"
        [class.hover:text-[#F4F7F5]]="!rla.isActive">

        <span class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] rounded-r bg-[#35D68C] transition-all duration-200"
          [class.h-5]="rla.isActive" [class.h-0]="!rla.isActive"></span>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
          @switch (link.icon) {
            @case ('grid') {
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            }
            @case ('users') {
              <circle cx="9" cy="8" r="3.2"></circle>
              <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>
              <circle cx="18" cy="9" r="2.4"></circle>
              <path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"></path>
            }
            @case ('tasks') {
              <path d="M4 6h1.6"></path>
              <path d="M9 6h11"></path>
              <path d="M4 12h1.6"></path>
              <path d="M9 12h11"></path>
              <path d="M4 18h1.6"></path>
              <path d="M9 18h11"></path>
              <path d="M4.3 6l.9.9L6.6 5.4" stroke="none"></path>
            }
            @case ('team') {
              <circle cx="8" cy="8" r="3"></circle>
              <circle cx="17" cy="9" r="2.6"></circle>
              <path d="M2.5 20c0-3.3 2.5-6 5.5-6s5.5 2.7 5.5 6"></path>
              <path d="M14.5 14.4c2.4.5 4 2.6 4 5.6"></path>
            }
          }
        </svg>

        <span class="truncate">{{ link.label }}</span>
      </a>
    }
  </nav>

  <div class="px-3 py-4 border-t border-[#1D4534]">
    <button (click)="deconnexion()"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm text-[#8FAFA0] hover:text-[#F4F7F5] hover:bg-[#15402F]/60 transition-colors">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
        <path d="M15 4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"></path>
        <path d="M18 15l4-3-4-3"></path>
        <path d="M22 12H10"></path>
      </svg>
      <span>Déconnexion</span>
    </button>
  </div>
</aside>
